name: Test Upload

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing stable AZHE release tag
        type: string
        required: true
        default: v3.1.3
  push:
    branches:
      - lfalslev/bed-7545

permissions:
  contents: read

jobs:
  test-upload-version:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # ratchet:aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.BHE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BHE_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update "azurehound-latest-version" file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag || 'v3.1.1-rc2' }}
        shell: bash
        run: |
          is_prerelease=$(gh release view "$RELEASE_TAG" \
            --json isDraft,isPrerelease \
            --jq '.isDraft or .isPrerelease')

          if [[ "$is_prerelease" == "true" ]]; then
            echo "Skipping draft or prerelease: $RELEASE_TAG"
            exit 0
          fi

          printf '%s' "$RELEASE_TAG" |
            aws s3 cp - "s3://${{ secrets.BHE_AWS_BUCKET }}/azurehound-latest-version"